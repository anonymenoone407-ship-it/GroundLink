[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundlink-channel-agent"
version = "0.1.0"
description = "Offline GroundLink Guardian VM3 Channel agent core"
requires-python = ">=3.11"
dependencies = ["groundlink-command-transport==1.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["channel_agent*"]
